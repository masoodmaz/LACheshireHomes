name: Deploy to Lightsail

# Deploys to the running Lightsail Docker host on every push to master.
# Runs on a SELF-HOSTED runner installed on the server itself, so no inbound
# SSH is needed — the runner connects outbound to GitHub and deploys locally.
on:
  push:
    branches: [master]
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lacheshirehomes]
    steps:
      - name: Pull latest code and rebuild the container
        run: |
          set -euo pipefail
          # /opt/lacheshirehomes is root-owned and not readable by the runner
          # user, so every command that needs to be inside it runs under sudo —
          # a bare `cd` here fails with "Permission denied".
          # Update code to match the pushed commit. Ignored files (.env,
          # Caddyfile, docker-compose.override.yml) and the data/ + uploads/
          # dirs are untracked, so they are left untouched.
          sudo git -C /opt/lacheshirehomes fetch --prune origin
          sudo git -C /opt/lacheshirehomes reset --hard "origin/${GITHUB_REF_NAME}"
          # Rebuild only the app image and restart it (Caddy/ngrok unaffected).
          sudo bash -c "cd /opt/lacheshirehomes && docker compose up -d --build app"
          sudo docker image prune -f
          # Log what is actually checked out, so a green run that silently
          # deployed nothing is visible in the job output.
          echo "Deployed commit: $(sudo git -C /opt/lacheshirehomes rev-parse --short HEAD)"

      - name: Health check
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/ || true)"
            if [ "$code" = "200" ]; then
              echo "App healthy (HTTP 200) after $((i*3))s."
              exit 0
            fi
            sleep 3
          done
          echo "::error::App did not return HTTP 200 within 60s. Recent logs:"
          sudo bash -c "cd /opt/lacheshirehomes && docker compose logs --tail 50 app"
          exit 1
