services:
  app:
    build: .
    container_name: lacheshirehomes
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      # Persist the SQLite database across container restarts
      - ./data:/app/data
      # Persist uploaded images and videos
      - ./public/uploads/images:/app/public/uploads/images
      - ./public/uploads/videos:/app/public/uploads/videos
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
